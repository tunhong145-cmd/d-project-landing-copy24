<!doctype html>
<html lang="zh-Hant">
<head>
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="description" content="最高可選 100 萬，線上試算每月還款，再填寫基本資料送出資金需求。">
 <meta name="theme-color" content="#f0d7ca" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#29201d" media="(prefers-color-scheme: dark)"><title>資金需求線上評估</title>
 <link rel="stylesheet" href="copper-c/base.css?v=20261119-1"><link rel="stylesheet" href="copper-c/notice.css?v=20261119-1"><link rel="stylesheet" href="copper-c/ice.css?v=20261119-1"><link rel="stylesheet" href="copper-c/optical-blue.css?v=20261119-1"><link rel="stylesheet" href="copper-c/copper-dawn.css?v=20261119-1">
 <script src="repo-pixels.js?v=20261010-1"></script><script src="app.js?v=20261111-warning-label" defer></script><script src="copper-c/calculator.js?v=20261119-1" defer></script><script src="copper-c/notice.js?v=20261119-1" defer></script><script src="copper-c/ice.js?v=20261119-1" defer></script>
</head>
<body><main class="app copper-dawn">
 <header class="intro-module"><img class="optical-hero-image" src="copper-dawn-hero.webp" width="1040" height="693" fetchpriority="high" alt=""><div class="copper-brand"><span class="company-name">至樂國際有限公司</span><span class="copper-service">線上額度評估</span></div><div class="top"><h1>快速額度試算<span>急用周轉首選</span></h1></div><p>需求金額最高可選 <strong>NT$1,000,000</strong></p></header>
 <section id="calculator" class="screen">
  <div class="calculator-panel">
   <div class="amount"><label for="amount">申請金額</label><strong id="amount-value">NT$ 100,000</strong><input id="amount" type="range" min="100000" max="1000000" step="50000" value="100000"><div class="limits"><span>NT$ 100,000</span><span>NT$ 1,000,000</span></div></div>
   <div class="term-section"><h2>還款期數</h2><div class="terms choices"><button type="button" data-term="24">24期</button><button type="button" data-term="36">36期</button><button type="button" data-term="60" class="selected" aria-pressed="true">60期</button><button type="button" data-term="84">84期</button><button type="button" data-term="120">120期</button><button type="button" data-term="144">144期</button><button type="button" data-term="180">180期</button><button type="button" data-term="240">240期</button><button type="button" data-term="300">300期</button><button type="button" data-term="360">360期</button></div></div>
   <details class="purpose-section"><summary><span>貸款用途</span><strong id="purpose-value">日常資金調度</strong><b aria-hidden="true">⌄</b></summary><div class="purposes choices"><button type="button" class="selected" aria-pressed="true">日常資金調度</button><button type="button">整合既有貸款</button><button type="button">自營生意備款</button><button type="button">家庭臨時支出</button><button type="button">設備工具添購</button><button type="button">其他資金安排</button></div></details>
   <div class="result"><div class="result-title">試算結果（僅供參考）</div><div class="payment-row"><div><p>每月應還</p><strong id="payment">NT$ 1,775</strong></div><div class="rate-block"><span>年利率</span><b id="rate">2.5%</b></div></div><details class="cost-details"><summary>查看試算明細<span aria-hidden="true">›</span></summary><div class="metrics"><div><span>總利息</span><b id="interest"></b></div><div><span>總還款</span><b id="total"></b></div></div></details></div>
  </div>
  <div class="apply-dock"><div class="optical-activity-slot"><aside class="application-notice" aria-label="歷史客戶申請紀錄，非核貸結果"><span class="optical-activity-label">客戶動態</span><span class="optical-activity-copy"><span class="capsule-person"><span id="notice-city">臺北市</span><strong id="notice-name">陳*華</strong></span><span class="capsule-status" id="notice-time">已完成申請</span></span><strong class="notice-amount"><span id="notice-amount">50</span><small>萬</small></strong></aside></div><button type="button" class="primary" id="apply">立即申請貸款 <span class="optical-arrow" aria-hidden="true">→</span></button></div>
  <p class="disclaimer">利率與期數為試算假設。實際額度、利率、期數及結果依個別評估為準。</p>
 </section>
 <noscript>請開啟 JavaScript 後使用線上申請功能。</noscript>
</main></body></html>
